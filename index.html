<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR-генератор</title>
<meta name="theme-color" content="#ece2cd">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%23ece2cd'/%3E%3Ctext x='256' y='358' font-size='300' text-anchor='middle' font-family='Georgia' font-weight='700' fill='%238b2019'%3E◱%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#ece2cd; --paper-d:#ddd0b2; --ink:#26201a; --ink-soft:#5a4a38;
  --seal:#8b2019; --gold:#9c7a2c; --frame:#3a2c1c; --card:rgba(58,44,28,.05);
  --ok:#4a7a3c;
}
body.dark{
  --paper:#1a1714; --paper-d:#24201a; --ink:#e8dfd0; --ink-soft:#a89880;
  --seal:#d4513f; --gold:#d4a94c; --frame:#4a3a28; --card:rgba(232,223,208,.05);
  --ok:#6a9c5a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  min-height:100%;width:100%;
  font-family:Georgia,serif;
  color:var(--ink);
  background:var(--paper);
  transition:background .3s,color .3s;
  padding:22px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 20% 15%,rgba(180,140,80,.15),transparent 70%),
    radial-gradient(ellipse 55% 45% at 80% 85%,rgba(140,100,50,.12),transparent 70%);
}
body.dark::before{opacity:.3}

/* Двойная рамка как в игре */
.frame{position:fixed;inset:12px;border:1px solid var(--frame);opacity:.4;pointer-events:none;z-index:1}
.frame::before{content:'';position:absolute;inset:4px;border:1px solid var(--frame);opacity:.5}

.page{
  position:relative;z-index:10;
  max-width:620px;margin:0 auto;
  display:flex;flex-direction:column;gap:18px;
}

/* Шапка */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
.hdr h1{
  font-family:Georgia,serif;
  font-size:clamp(26px,5vw,40px);
  font-weight:700;letter-spacing:.14em;
  color:var(--ink);
  text-shadow:3px 3px 0 rgba(139,32,25,.15);
  cursor:pointer;user-select:none;
}
.hdr h1 .dot{color:var(--seal)}
.hdr .tag{
  font-family:'Courier New',monospace;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;
  border:1px solid var(--frame);padding:4px 10px;background:var(--card);
}

/* Верхняя панель управления (как .controls) */
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctl-btn{
  background:var(--paper);border:1px solid var(--frame);border-radius:2px;
  padding:8px 14px;color:var(--ink);
  font-family:'Courier New',monospace;font-size:11px;font-weight:700;
  cursor:pointer;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
  box-shadow:2px 2px 0 rgba(58,44,28,.2);
  transition:all .1s;
}
.ctl-btn:hover{background:var(--paper-d);transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(58,44,28,.3)}
.ctl-btn.seal{color:var(--seal);border-color:var(--seal)}
.ctl-btn.gold{color:var(--gold);border-color:var(--gold)}

/* Карточка с полями */
.card{
  background:var(--paper);
  border:1px solid var(--frame);
  padding:22px;
  box-shadow:4px 4px 0 rgba(58,44,28,.22);
  position:relative;
}
.card::before{content:'';position:absolute;inset:5px;border:1px solid var(--frame);pointer-events:none;opacity:.25}
.card>*{position:relative;z-index:1}

/* Табы как в меню игры */
.tabs{
  display:flex;border:1px solid var(--frame);
  background:var(--card);margin-bottom:20px;
}
.tab{
  flex:1;padding:13px 8px;background:transparent;border:none;
  border-right:1px solid var(--frame);
  color:var(--ink-soft);
  font-family:'Courier New',monospace;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,color .15s;
}
.tab:last-child{border-right:none}
.tab.active{background:var(--paper-d);color:var(--seal);box-shadow:inset 0 -2px 0 var(--seal)}

/* Заголовки секций */
.section-title{
  font-family:'Courier New',monospace;font-size:11px;color:var(--ink);
  letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  display:flex;align-items:center;gap:10px;
  padding-bottom:8px;margin-bottom:12px;
  border-bottom:1px solid var(--frame);
}
.section-title .hint{font-size:9.5px;color:var(--ink-soft);font-weight:700;text-transform:none;letter-spacing:.05em}

/* Поля ввода */
.field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field-row .label{
  font-family:'Courier New',monospace;font-size:10px;font-weight:700;
  color:var(--ink-soft);letter-spacing:.16em;text-transform:uppercase;
}
textarea,input[type=text]{
  width:100%;padding:14px;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--frame);border-radius:2px;
  font-family:Georgia,serif;font-size:15px;
  outline:none;resize:vertical;
  box-shadow:inset 2px 2px 0 rgba(58,44,28,.08);
  transition:box-shadow .15s;
}
textarea{min-height:130px;line-height:1.5}
textarea:focus,input:focus{box-shadow:inset 2px 2px 0 rgba(58,44,28,.08),0 0 0 2px var(--seal)}

/* Дроп-зона */
.drop{
  border:2px dashed var(--frame);border-radius:2px;
  padding:28px 18px;text-align:center;
  cursor:pointer;color:var(--ink-soft);
  font-family:'Courier New',monospace;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  transition:all .15s;background:var(--card);
}
.drop:hover,.drop.over{
  background:var(--paper-d);color:var(--ink);
  border-color:var(--seal);border-style:solid;
}
.drop b{color:var(--seal);font-weight:800}
.drop .sub{display:block;margin-top:6px;font-size:9.5px;text-transform:none;letter-spacing:.05em;color:var(--ink-soft)}

.file-info{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;margin-top:12px;
  background:var(--card);border:1px solid var(--frame);
  border-left:4px solid var(--gold);
  font-family:'Courier New',monospace;font-size:11px;
}
.file-info img{width:52px;height:52px;object-fit:cover;border:1px solid var(--frame)}
.file-info .ico{font-size:30px;width:52px;text-align:center}
.file-info .meta{flex:1;line-height:1.4;overflow:hidden;word-break:break-all}
.file-info .meta .name{font-family:Georgia,serif;font-size:13px;font-weight:700;color:var(--ink)}
.file-info .meta .size{color:var(--ink-soft);font-size:10.5px;margin-top:2px}

/* Сетка параметров */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.opt{display:flex;flex-direction:column;gap:5px}
.opt label{
  font-family:'Courier New',monospace;font-size:9.5px;font-weight:700;
  color:var(--ink-soft);letter-spacing:.16em;text-transform:uppercase;
}
.opt select{
  padding:11px 12px;background:var(--paper);color:var(--ink);
  border:1px solid var(--frame);border-radius:2px;
  font-family:'Courier New',monospace;font-size:12px;font-weight:700;
  outline:none;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,44,28,.15);
}

/* Главная кнопка */
.btn-primary{
  width:100%;padding:16px;margin-top:6px;
  font-family:'Courier New',monospace;font-size:13px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--paper);background:var(--seal);
  border:1px solid var(--frame);border-radius:2px;cursor:pointer;
  box-shadow:3px 3px 0 rgba(58,44,28,.4);
  transition:transform .1s,box-shadow .1s;
}
.btn-primary:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(58,44,28,.45)}
.btn-primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(58,44,28,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* Результат */
.result{margin-top:22px;text-align:center}
.canvas-wrap{
  display:inline-block;position:relative;
  padding:12px;background:var(--paper);
  border:1px solid var(--frame);
  box-shadow:4px 4px 0 rgba(58,44,28,.25);
}
.canvas-wrap::before{content:'';position:absolute;inset:3px;border:1px solid var(--frame);pointer-events:none;opacity:.25}
canvas{display:block;max-width:100%;height:auto;background:#fff}

.status{
  font-family:'Courier New',monospace;font-size:11px;font-weight:700;
  letter-spacing:.06em;margin-top:14px;min-height:18px;line-height:1.5;
  color:var(--ink-soft);
}
.status.err{color:var(--seal)}
.status.ok{color:var(--ok)}
.status.warn{color:var(--gold)}

.btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn-sm{
  padding:11px 22px;
  font-family:'Courier New',monospace;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--frame);border-radius:2px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,44,28,.25);
  transition:all .1s;text-decoration:none;
}
.btn-sm:hover{background:var(--paper-d);transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(58,44,28,.3)}
.btn-sm.seal{color:var(--seal);border-color:var(--seal)}
.btn-sm.gold{color:var(--gold);border-color:var(--gold)}

.hidden{display:none!important}
.hint-foot{
  font-family:'Courier New',monospace;font-size:9.5px;
  color:var(--ink-soft);letter-spacing:.06em;
  margin-top:14px;line-height:1.5;text-align:center;
}

/* Тост как в игре */
.toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-14px);
  background:var(--ink);color:var(--paper);
  padding:11px 24px;
  font-family:'Courier New',monospace;font-size:11.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  z-index:1000;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:3px 3px 0 rgba(58,44,28,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Адаптив */
@media(max-width:520px){
  html,body{padding:16px}
  .frame{inset:8px}
  .card{padding:16px}
  .hdr h1{font-size:24px;letter-spacing:.10em}
  .hdr .tag{font-size:8.5px;padding:3px 8px}
  .ctl-btn{padding:6px 10px;font-size:10px}
  .tab{padding:11px 4px;font-size:9.5px;letter-spacing:.05em}
  .opts{grid-template-columns:1fr;gap:8px}
  .btn-sm{padding:10px 16px;font-size:10px}
}
</style>
</head>

<div class="page">

  <!-- Шапка -->
  <div class="hdr">
    <h1 id="title">QR<span class="dot">·</span>ГЕНЕРАТОР</h1>
    <div class="controls">
      <button class="ctl-btn" id="theme-toggle">🌙 Тёмная</button>
    </div>
  </div>

  <!-- Карточка -->
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="text">📝 Текст / ссылка</button>
      <button class="tab" data-tab="file">🖼️ Фото / файл</button>
    </div>

    <!-- Вкладка текст -->
    <div id="panel-text">
      <div class="section-title">Введите текст <span class="hint">или URL</span></div>
      <div class="field-row">
        <textarea id="textInput" placeholder="Введите текст или ссылку…">Привет, мир! 👋</textarea>
      </div>
    </div>

    <!-- Вкладка файл -->
    <div id="panel-file" class="hidden">
      <div class="section-title">Загрузите файл <span class="hint">до ~2 КБ</span></div>
      <div class="drop" id="drop">
        <b>Нажмите</b> или перетащите сюда<br>
        <span class="sub">Картинка · PDF · txt · до ~2 КБ</span>
      </div>
      <input type="file" id="fileInput" hidden>
      <div id="fileInfo"></div>
    </div>

    <!-- Параметры -->
    <div class="opts">
      <div class="opt">
        <label>Размер</label>
        <select id="sizeSel">
          <option value="256">256 px</option>
          <option value="512" selected>512 px</option>
          <option value="1024">1024 px</option>
        </select>
      </div>
      <div class="opt">
        <label>Коррекция ошибок</label>
        <select id="eclSel">
          <option value="L" selected>L — макс. объём</option>
          <option value="M">M — средняя</option>
          <option value="Q">Q — высокая</option>
          <option value="H">H — максимальная</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" id="genBtn">Сгенерировать QR-код</button>

    <div class="result">
      <div id="canvasWrap" class="hidden">
        <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
      </div>
      <div class="status" id="status"></div>
      <div class="btn-row">
        <button class="btn-sm gold hidden" id="dlBtn">⬇ Скачать PNG</button>
      </div>
      <p class="hint-foot" id="hint">Всё работает локально. Никаких запросов в интернет.</p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

  QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectionLevel){
    var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectionLevel);
    if (rsBlock == undefined) throw new Error('bad rs block');
    var length = rsBlock.length / 3, list = [];
    for (var i = 0; i < length; i++){
      var count = rsBlock[i*3+0], totalCount = rsBlock[i*3+1], dataCount = rsBlock[i*3+2];
      for (var j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
    }
    return list;
  };
  QRRSBlock.getRsBlockTable = function(typeNumber, ecl){
    switch (ecl){
      case QRErrorCorrectionLevel.L: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber-1)*4+0];
      case QRErrorCorrectionLevel.M: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber-1)*4+1];
      case QRErrorCorrectionLevel.Q: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber-1)*4+2];

  function QRBitBuffer(){ this.buffer = []; this.length = 0; }

    getBuffer: function(){ return this.buffer; },

      for (var i = 0; i < length; i++)
        this.putBit(((num >>> (length - i - 1)) & 1) == 1);
    },
    putBit: function(bit){
      var bufIndex = Math.floor(this.length / 8);
      if (this.buffer.length <= bufIndex) this.buffer.push(0);
      if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));

    PATTERN_POSITION_TABLE: [
      [],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
      [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],
      [6,30,56,82],[6,30,58,86],[6,34,62,90],[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],
      [6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],[6,26,50,74,98,122],
      [6,30,54,78,102,126],[6,26,52,78,104,130],[6,30,56,82,108,134],[6,34,60,86,112,138],
      [6,30,58,86,114,142],[6,34,62,90,118,146],[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],
      [6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],[6,30,58,86,114,142,170]
    ],
    G15: (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0),
    G18: (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0),
    G15_MASK: (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1),
    getBCHTypeInfo: function(data){
      var d = data << 10;
      while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0)
        d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
      return ((data << 10) | d) ^ QRUtil.G15_MASK;
    },
    getBCHTypeNumber: function(data){
      var d = data << 12;
      while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0)

    getBCHDigit: function(data){

        case QRMaskPattern.PATTERN000: return function(i,j){ return (i+j)%2 == 0; };

        case QRMaskPattern.PATTERN010: return function(i,j){ return j%3 == 0; };
        case QRMaskPattern.PATTERN011: return function(i,j){ return (i+j)%3 == 0; };
        case QRMaskPattern.PATTERN100: return function(i,j){ return (Math.floor(i/2)+Math.floor(j/3))%2 == 0; };
        case QRMaskPattern.PATTERN101: return function(i,j){ return (i*j)%2 + (i*j)%3 == 0; };
        case QRMaskPattern.PATTERN110: return function(i,j){ return ((i*j)%2 + (i*j)%3)%2 == 0; };

          case QRMode.MODE_NUMBER: return 12;
          case QRMode.MODE_ALPHA_NUM: return 11;
          case QRMode.MODE_8BIT_BYTE: return 16;

      for (var row = 0; row < moduleCount; row++){
        for (var col = 0; col < moduleCount; col++){
          var sameCount = 0, dark = qrCode.isDark(row, col);
          for (var r = -1; r <= 1; r++){
            if (row + r < 0 || moduleCount <= row + r) continue;
            for (var c = -1; c <= 1; c++){
              if (col + c < 0 || moduleCount <= col + c) continue;
              if (r == 0 && c == 0) continue;
              if (dark == qrCode.isDark(row + r, col + c)) sameCount++;

          }
          if (sameCount > 5) lostPoint += (3 + sameCount - 5);

      }
      for (var row = 0; row < moduleCount - 1; row++){
        for (var col = 0; col < moduleCount - 1; col++){
          var count = 0;
          if (qrCode.isDark(row, col)) count++;
          if (qrCode.isDark(row + 1, col)) count++;
          if (qrCode.isDark(row, col + 1)) count++;
          if (qrCode.isDark(row + 1, col + 1)) count++;
          if (count == 0 || count == 4) lostPoint += 3;
        }
      }
      for (var row = 0; row < moduleCount; row++){
        for (var col = 0; col < moduleCount - 6; col++){
          if (qrCode.isDark(row, col) && !qrCode.isDark(row, col+1) && qrCode.isDark(row, col+2) &&
              qrCode.isDark(row, col+3) && qrCode.isDark(row, col+4) && !qrCode.isDark(row, col+5) &&
              qrCode.isDark(row, col+6)) lostPoint += 40;
        }
      }
      for (var col = 0; col < moduleCount; col++){
        for (var row = 0; row < moduleCount - 6; row++){
          if (qrCode.isDark(row, col) && !qrCode.isDark(row+1, col) && qrCode.isDark(row+2, col) &&
              qrCode.isDark(row+3, col) && qrCode.isDark(row+4, col) && !qrCode.isDark(row+5, col) &&
              qrCode.isDark(row+6, col)) lostPoint += 40;

      }
      var darkCount = 0;
      for (var col = 0; col < moduleCount; col++)
        for (var row = 0; row < moduleCount; row++)

  function QR8bitByte(data){

        byteArray[3] = 0x80 | (code & 0x3F);

        byteArray[0] = 0xE0 | ((code & 0xF000) >>> 12);

        byteArray[2] = 0x80 | (code & 0x3F);

        byteArray[0] = code;

  var qrcode = function(typeNumber, errorCorrectionLevel){
    var PAD0 = 0xEC, PAD1 = 0x11;
    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null, _moduleCount = 0, _dataCache = null, _dataList = [];
    var _this = {};

    var makeImpl = function(test, maskPattern){
      _moduleCount = _typeNumber * 4 + 17;
      _modules = new Array(_moduleCount);
      for (var row = 0; row < _moduleCount; row++){
        _modules[row] = new Array(_moduleCount);
        for (var col = 0; col < _moduleCount; col++) _modules[row][col] = null;
      }
      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) setupTypeNumber(test);
      if (_dataCache == null) _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

    var setupPositionProbePattern = function(row, col){
      for (var r = -1; r <= 7; r++){
        if (row + r <= -1 || _moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c++){
          if (col + c <= -1 || _moduleCount <= col + c) continue;
          if ((0 <= r && r <= 6 && (c == 0 || c == 6)) ||
              (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
              (2 <= r && r <= 4 && 2 <= c && c <= 4)){
            _modules[row + r][col + c] = true;
          } else {

    var setupTimingPattern = function(){
      for (var r = 8; r < _moduleCount - 8; r++){
        if (_modules[r][6] != null) continue;
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c++){
        if (_modules[6][c] != null) continue;
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function(){
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i++){
        for (var j = 0; j < pos.length; j++){
          var row = pos[i], col = pos[j];
          if (_modules[row][col] != null) continue;
          for (var r = -2; r <= 2; r++){
            for (var c = -2; c <= 2; c++){
              if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)){
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test){
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i++){
        var mod = (!test && ((bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i++){
        var mod = (!test && ((bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern){
      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i++){
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 6) _modules[i][8] = mod;
        else if (i < 8) _modules[i + 1][8] = mod;
        else _modules[_moduleCount - 15 + i][8] = mod;
      }
      for (var i = 0; i < 15; i++){
        var mod = (!test && ((bits >> i) & 1) == 1);
        if (i < 8) _modules[8][_moduleCount - i - 1] = mod;
        else if (i < 9) _modules[8][15 - i - 1 + 1] = mod;
        else _modules[8][15 - i - 1] = mod;

      _modules[_moduleCount - 8][8] = (!test);
    };

      var inc = -1, row = _moduleCount - 1, bitIndex = 7, byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

          for (var c = 0; c < 2; c++){
            if (_modules[row][col - c] == null){
              var dark = false;
              if (byteIndex < data.length)
                dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
              var mask = maskFunc(row, col - c);
              if (mask) dark = !dark;
              _modules[row][col - c] = dark;
              bitIndex -= 1;
              if (bitIndex == -1){ byteIndex += 1; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || _moduleCount <= row){
            row -= inc; inc = -inc; break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks){
      var offset = 0, maxDcCount = 0, maxEcCount = 0;
      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);
      for (var r = 0; r < rsBlocks.length; r++){
        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;
        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);
        dcdata[r] = new Array(dcCount);
        for (var i = 0; i < dcdata[r].length; i++)
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        offset += dcCount;
        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i++){
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
        }
      }
      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
      var data = new Array(totalCodeCount);
      var index = 0;
      for (var i = 0; i < maxDcCount; i++)
        for (var r = 0; r < rsBlocks.length; r++)
          if (i < dcdata[r].length){ data[index] = dcdata[r][i]; index++; }
      for (var i = 0; i < maxEcCount; i++)
        for (var r = 0; r < rsBlocks.length; r++)
          if (i < ecdata[r].length){ data[index] = ecdata[r][i]; index++; }
      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList){
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
      var buffer = new QRBitBuffer();
      for (var i = 0; i < dataList.length; i++){
        var data = dataList[i];
        buffer.put(data.mode, 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
      if (buffer.getLengthInBits() > totalDataCount * 8)
        throw new Error('code length overflow');
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
      while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
      while (true){
        if (buffer.getLengthInBits() >= totalDataCount * 8) break;
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) break;
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode){
      mode = mode || 'Byte';
      var newData = null;
      switch (mode){
        case 'Byte': newData = new QR8bitByte(data); break;
        default: throw 'mode:' + mode;
      }
      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col){
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col)
        throw row + ',' + col;
      return _modules[row][col];
    };

    _this.getModuleCount = function(){ return _moduleCount; };

    _this.make = function(){
      if (_typeNumber < 1){
        var typeNumber = 1;
        for (; typeNumber < 40; typeNumber++){
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = new QRBitBuffer();
          for (var i = 0; i < _dataList.length; i++){
            var data = _dataList[i];
            buffer.put(data.mode, 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
          if (buffer.getLengthInBits() <= totalDataCount * 8) break;
        }
        _typeNumber = typeNumber;
      }
      makeImpl(false, getBestMaskPattern());
    };

    return _this;
  };

  return qrcode;
})();


/* ============================================================
   UI + тема + тосты
   ============================================================ */
(function(){
  var K_THEME = 'qr_theme_v1';

  var tabs      = document.querySelectorAll('.tab');
  var panelText = document.getElementById('panel-text');
  var panelFile = document.getElementById('panel-file');
  var textInput = document.getElementById('textInput');
  var drop      = document.getElementById('drop');
  var fileInput = document.getElementById('fileInput');
  var fileInfo  = document.getElementById('fileInfo');
  var sizeSel   = document.getElementById('sizeSel');
  var eclSel    = document.getElementById('eclSel');
  var genBtn    = document.getElementById('genBtn');
  var canvas    = document.getElementById('canvas');
  var canvasWrap= document.getElementById('canvasWrap');
  var statusEl  = document.getElementById('status');
  var dlBtn     = document.getElementById('dlBtn');
  var hint      = document.getElementById('hint');
  var toastEl   = document.getElementById('toast');
  var themeBtn  = document.getElementById('theme-toggle');

  var mode = 'text';
  var payload = null;
  var fileName = 'qr-code';

  /* ---------- Тема ---------- */
  function applyTheme(t){
    document.body.classList.toggle('dark', t === 'dark');
    themeBtn.textContent = t === 'dark' ? '☀ Светлая' : '🌙 Тёмная';
    try { localStorage.setItem(K_THEME, t); } catch(e){}
  }
  var savedTheme = 'light';
  try { savedTheme = localStorage.getItem(K_THEME) || 'light'; } catch(e){}
  applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
  });

  /* ---------- Тост ---------- */
  var toastTimer = null;
  function showToast(t){
    toastEl.textContent = t;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }

  /* ---------- Табы ---------- */
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      mode = t.dataset.tab;
      panelText.classList.toggle('hidden', mode !== 'text');
      panelFile.classList.toggle('hidden', mode !== 'file');
      setStatus('');
    });
  });

  /* ---------- Загрузка файла ---------- */
  drop.addEventListener('click', function(){ fileInput.click(); });
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function(e){
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function(){
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file){
    fileName = file.name.replace(/\.[^.]+$/, '') || 'qr-code';
    var reader = new FileReader();
    reader.onload = function(){
      payload = reader.result;
      var bytes = payload.length;

      fileInfo.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'file-info';

      if (file.type.indexOf('image/') === 0){
        var img = document.createElement('img');
        img.src = payload;
        box.appendChild(img);
      } else {
        var ico = document.createElement('div');
        ico.className = 'ico';
        ico.textContent = '📄';
        box.appendChild(ico);
      }

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML =
        '<div class="name">' + escapeHtml(file.name) + '</div>' +
        '<div class="size">' + fmtSize(file.size) + ' · в QR ~' + fmtSize(bytes) + '</div>';
      box.appendChild(meta);
      fileInfo.appendChild(box);

      if (bytes > 2300){
        setStatus('⚠ Файл слишком большой. Сожмите или вставьте ссылку на облако.', 'warn');
        showToast('Файл слишком большой');
      } else {
        setStatus('Файл загружен. Нажмите «Сгенерировать».', 'ok');
      }
    };
    reader.onerror = function(){ setStatus('Не удалось прочитать файл.', 'err'); };
    reader.readAsDataURL(file);
  }

  /* ---------- Генерация ---------- */
  genBtn.addEventListener('click', function(){
    var data;
    if (mode === 'text'){
      data = textInput.value;
      fileName = 'qr-text';
      if (!data || !data.trim()){ setStatus('Введите текст или ссылку.', 'err'); showToast('Пусто'); return; }
    } else {
      data = payload;
      if (!data){ setStatus('Сначала выберите файл.', 'err'); showToast('Нет файла'); return; }
    }

    genBtn.disabled = true;
    setStatus('Генерация…');

    setTimeout(function(){
      try {
        var qr = qrcode(0, eclSel.value);
        qr.addData(data, 'Byte');
        qr.make();

        drawOnCanvas(qr, parseInt(sizeSel.value, 10));

        canvasWrap.classList.remove('hidden');
        dlBtn.classList.remove('hidden');
        setStatus('✔ Готово · версия ' + qr.getModuleCount() + '×' + qr.getModuleCount() + ' · ' + eclSel.value, 'ok');
        showToast('QR-код готов');
        hint.textContent = (mode === 'file')
          ? 'Отсканируйте камерой — данные декодируются как текст или ссылка.'
          : 'Наведите камеру телефона на код.';
      } catch (err){
        console.error(err);
        canvasWrap.classList.add('hidden');
        dlBtn.classList.add('hidden');
        var msg = err && err.message ? err.message : String(err);
        setStatus('Ошибка: ' + msg + '. Уменьшите объём или выберите уровень L.', 'err');
        showToast('Не помещается');
      } finally {
        genBtn.disabled = false;
      }
    }, 20);
  });

  function drawOnCanvas(qr, size){
    var count = qr.getModuleCount();
    var margin = 4;
    var total = count + margin * 2;
    var cell = Math.max(1, Math.floor(size / total));
    var real = cell * total;

    canvas.width = real;
    canvas.height = real;
    canvas.style.width = real + 'px';
    canvas.style.height = real + 'px';

    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, real, real);
    ctx.fillStyle = '#000000';
    for (var r = 0; r < count; r++){
      for (var c = 0; c < count; c++){
        if (qr.isDark(r, c))
          ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
      }
    }
  }

  /* ---------- Скачать ---------- */
  dlBtn.addEventListener('click', function(){
    var a = document.createElement('a');
    a.download = fileName + '-qr.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('Сохранено');
  });

  /* ---------- Утилиты ---------- */
  function setStatus(msg, cls){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }
  function fmtSize(b){
    if (b < 1024) return b + ' Б';
    return (b / 1024).toFixed(1) + ' КБ';
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- Клавиатура: Ctrl+Enter = генерировать ---------- */
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      if (mode === 'text') genBtn.click();
    }
  });

  /* ---------- Клик по заголовку (секрет, как в игре) ---------- */
  var titleEl = document.getElementById('title');
  var clicks = 0;
  titleEl.addEventListener('click', function(){
    clicks++;
    titleEl.style.letterSpacing = (0.14 + (clicks % 6) * 0.02) + 'em';
    setTimeout(function(){ titleEl.style.letterSpacing = '0.14em'; }, 200);
    if (clicks === 7) showToast('Привет из «ХАХАХА» 👋');
  });
})();
</script>
</body>
